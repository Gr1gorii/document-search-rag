[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doclens"
version = "0.1.0"
description = "A local documentation assistant with inspectable retrieval and citations"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-beautifulsoup4", "playwright>=1.50,<2"]

[tool.setuptools.package-data]
doclens = ["static/*"]

[tool.setuptools.packages.find]
include = ["doclens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: requires the existing local Ollama server"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
